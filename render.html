<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BeatFlow Studio Headless Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Ops+One&family=Cinzel:wght@700;900&family=Courier+Prime:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800;900&family=Kanit:wght@700;800;900&family=Montserrat:wght@600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@600;700;800;900&family=Rajdhani:wght@600;700&family=Rubik:wght@700;800;900&family=Special+Elite&family=Syncopate:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    #video-harness { position: fixed; top: 0; left: 0; width: 4px; height: 4px; opacity: 0.001; pointer-events: none; z-index: -9999; overflow: hidden; }
    #video-harness video { width: 100%; height: 100%; object-fit: cover; }
    #font-preloader { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; font-size: 16px; }
  </style>
</head>
<body>
  <div id="video-harness"></div>
  <!-- Hidden DOM elements forcing immediate download and rendering of all webfonts in Chromium -->
  <div id="font-preloader">
    <span style="font-family: 'Anton';">Anton</span>
    <span style="font-family: 'Bebas Neue';">Bebas</span>
    <span style="font-family: 'Playfair Display'; font-style: italic; font-weight: bold;">Playfair</span>
    <span style="font-family: 'Courier Prime'; font-weight: bold;">Courier</span>
    <span style="font-family: 'Special Elite';">Special</span>
    <span style="font-family: 'Montserrat'; font-weight: 800;">Montserrat</span>
    <span style="font-family: 'Kanit'; font-weight: 800;">Kanit</span>
    <span style="font-family: 'Rubik'; font-weight: 900;">Rubik</span>
    <span style="font-family: 'Inter'; font-weight: 700;">Inter</span>
  </div>
  <canvas id="render-canvas"></canvas>
  <script type="module" src="/src/render-app.ts"></script>
</body>
</html>
